<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Share your screen · Rajcord</title>
    <link rel="stylesheet" href="picker.css" />
    <script defer src="picker.js"></script>
  </head>
  <body>
    <main>
      <header class="picker-heading">
        <div class="heading-icon" aria-hidden="true">▣</div>
        <div>
          <h1>Share Your Screen</h1>
          <p class="intro">Choose an application window or an entire display.</p>
        </div>
      </header>
      <div class="source-tabs" role="tablist" aria-label="Source type">
        <button
          id="tab-applications"
          class="is-active"
          type="button"
          role="tab"
          aria-selected="true"
          data-kind-tab="window"
        >
          <span aria-hidden="true">▣</span> Applications <small id="window-count">0</small>
        </button>
        <button
          id="tab-screens"
          type="button"
          role="tab"
          aria-selected="false"
          data-kind-tab="screen"
        >
          <span aria-hidden="true">▤</span> Entire Screen <small id="screen-count">0</small>
        </button>
      </div>
      <p id="status" role="status" aria-live="polite">Loading available sources…</p>
      <section
        id="source-panel"
        class="source-area"
        role="tabpanel"
        aria-labelledby="tab-applications"
      >
        <ul id="sources" aria-label="Available sources"></ul>
      </section>
      <div class="picker-bottom">
        <fieldset id="sound" disabled>
          <legend>Share audio</legend>
          <label><input type="radio" name="sound" value="none" /> Video only</label>
          <label
            ><input id="system-sound" type="radio" name="sound" value="system" disabled /> System
            audio</label
          >
          <p id="sound-help">Select a source to see its audio options.</p>
        </fieldset>
        <div class="picker-footer">
          <p id="selected-label">No source selected</p>
          <button id="cancel" type="button">Cancel</button>
          <button id="confirm" class="primary" type="button" disabled>Use this source</button>
        </div>
      </div>
      <p class="notice">
        A local preview and confirmation come next. This choice alone does not publish your screen.
      </p>
    </main>
  </body>
</html>
