name: Delivery
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish the tested main image without deploying
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  # Keep deployments and pending approvals serialized on main.
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
    with:
      prepare_release: ${{ (github.event_name == 'push' && vars.HOSTING_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_only == true) }}

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && vars.HOSTING_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_only == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Reject superseded releases
        run: node scripts/ci/policy.mjs main
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
          path: artifacts
      - name: Publish the tested image by digest
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gzip -dc artifacts/tricord-image.tar.gz | docker load
          test "$(docker inspect tricord-ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          tag="ghcr.io/treca-raja/rajcord-public:$GITHUB_SHA"
          docker tag tricord-ci "$tag"
          docker push "$tag"
          image=$(docker inspect "$tag" --format '{{index .RepoDigests 0}}')
          TRICORD_IMAGE="$image" node scripts/ci/policy.mjs main
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

  production-policy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.HOSTING_ENABLED == 'true' && inputs.publish_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Require production approvals before entering its environment
        run: node scripts/ci/policy.mjs production
        env:
          GH_TOKEN: ${{ github.token }}

  production:
    needs: [publish, production-policy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.HOSTING_ENABLED == 'true' && inputs.publish_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # GitHub waits for the configured reviewer before releasing production secrets.
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Deploy the exact CI-tested image and check production
        run: node scripts/ci/deploy.mjs production
        env:
          GH_TOKEN: ${{ github.token }}
          TRICORD_IMAGE: ${{ needs.publish.outputs.image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_HTTPS_HOST: ${{ vars.DEPLOY_HTTPS_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
