name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start disposable CI services
        run: |
          pnpm db:setup
          pnpm voice:setup
          pnpm db:up
          pnpm voice:up
      - run: pnpm db:migrate
      - run: pnpm test:db
      - run: pnpm build
      - name: Build deployable server image
        run: docker build -f infrastructure/server/Dockerfile -t tricord-ci .
      - name: Verify image and backup restore
        run: node scripts/server-image-smoke.mjs tricord-ci
      - name: Stop CI services
        if: always()
        run: |
          if test -f infrastructure/.env.voice; then pnpm voice:down; fi
          if test -f infrastructure/.env; then pnpm db:down; fi
