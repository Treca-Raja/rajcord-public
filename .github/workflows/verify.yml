name: Verify
on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  workflow_call:
    inputs:
      prepare_release:
        description: Save the tested main image for the calling delivery workflow
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  # Main delivery reuses these checks without cancellation.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check PR source and target branches
        run: node scripts/ci/pr-policy.mjs
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Validate workflow and operator scripts
        run: |
          docker run --rm --network none --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 .github/workflows/*.yml
          docker run --rm --network none --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" --workdir /repo koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d -x scripts/hosting/*.sh
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start disposable CI services
        run: |
          pnpm db:setup
          pnpm voice:setup
          pnpm db:up
          pnpm voice:up
      - run: pnpm db:migrate
      - run: pnpm test:db
      - run: pnpm build
      - name: Verify browser authentication, chat and notifications
        run: |
          TRICORD_BROWSER_PATH="$(command -v google-chrome)"
          export TRICORD_BROWSER_PATH
          test -x "$TRICORD_BROWSER_PATH"
          pnpm --filter @tricord/api test:browser
      - name: Build deployable server image
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -f infrastructure/server/Dockerfile -t tricord-ci .
      - name: Verify image and backup restore
        run: node scripts/server-image-smoke.mjs tricord-ci
      - name: Verify hosted proxy and service configuration
        run: node scripts/hosting/smoke.mjs tricord-ci
      - name: Save the tested image for publication
        if: inputs.prepare_release == true && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts
          docker save tricord-ci | gzip > artifacts/tricord-image.tar.gz
      - name: Upload the exact tested image
        if: inputs.prepare_release == true && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: artifacts/tricord-image.tar.gz
          retention-days: 2
          if-no-files-found: error
          compression-level: 0 # The image tar is already compressed.
      - name: Stop CI services
        if: always()
        run: |
          if test -f infrastructure/.env.voice; then pnpm voice:down; fi
          if test -f infrastructure/.env; then pnpm db:down; fi
