listening-port=3479
tls-listening-port=5350
min-port=52000
max-port=52063
pidfile=/tmp/turnserver.pid
userdb=/tmp/turnserver.sqlite
cert=/run/screen-turn/fullchain.pem
pkey=/run/screen-turn/privkey.pem
log-file=stdout
simple-log
no-cli
no-tcp-relay
no-dtls
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-dynamic-ip-list
no-auth-pings
use-auth-secret
rest-api-separator=.
stale-nonce=120
max-allocate-lifetime=120
user-quota=12
total-quota=48
max-bps=1750000
bps-capacity=36000000
relay-threads=2
prometheus
prometheus-port=9641
