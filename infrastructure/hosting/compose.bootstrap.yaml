# Standalone initial HTTP-01 certificate bootstrap. Use the same project name,
# stop this proxy afterwards, then start compose.yaml with the issued certificate.
name: tricord-${TRICORD_ENVIRONMENT:?Set staging or production}
services:
  proxy:
    image: nginx:1.30.6-alpine@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    restart: unless-stopped
    ports: ['80:80/tcp']
    volumes:
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/nginx-bootstrap.conf:/etc/nginx/nginx.conf:ro
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/acme:/var/www/acme:ro
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: ['no-new-privileges:true']
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    profiles: [tools]
    volumes:
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/acme:/var/www/acme
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/letsencrypt:/etc/letsencrypt
    tmpfs: [/var/lib/letsencrypt, /var/log/letsencrypt]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
