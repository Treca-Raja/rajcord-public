name: tricord-${TRICORD_ENVIRONMENT:?Set staging or production}

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:17.11-alpine3.24@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    restart: unless-stopped
    env_file: ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/postgres.env
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tricord -d tricord']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    security_opt: ['no-new-privileges:true']

  app:
    image: ${TRICORD_IMAGE:?Set the tested image digest}
    restart: unless-stopped
    init: true
    env_file: ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/app.env
    networks:
      database:
      control:
      frontend:
        ipv4_address: 172.30.241.3
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    restart: unless-stopped
    command: ['--config', '/etc/livekit.yaml']
    volumes:
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/livekit.yaml:/etc/livekit.yaml:ro
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/letsencrypt:/etc/letsencrypt:ro
    networks: [control, media]
    ports:
      - '7881:7881/tcp'
      - '7882:7882/udp'
      - '3478:3478/udp'
      - '5349:5349/tcp'
      # Embedded TURN relay sockets; the bridge must route these back to LiveKit.
      - '50000-50199:50000-50199/udp'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    stop_grace_period: 30s
    logging: *logging

  proxy:
    image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    restart: unless-stopped
    volumes:
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/acme:/var/www/acme:ro
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/letsencrypt:/etc/letsencrypt:ro
    networks:
      frontend:
        ipv4_address: 172.30.241.2
      edge:
    ports: ['80:80/tcp', '443:443/tcp']
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: ['no-new-privileges:true']
    logging: *logging

  certbot:
    image: certbot/certbot:v5.10.0@sha256:c5698da859429ccee0fcc299a8000368198222d1f9e789ab6e388b491e8ce06d
    profiles: [tools]
    volumes:
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/acme:/var/www/acme
      - ${TRICORD_CONFIG_DIR:?Set the initialized runtime directory}/letsencrypt:/etc/letsencrypt
    networks: [edge]
    tmpfs: [/var/lib/letsencrypt, /var/log/letsencrypt]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: *logging

volumes:
  postgres:

networks:
  database:
    internal: true
  control:
    internal: true
  frontend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.241.0/28
  media:
  edge:
